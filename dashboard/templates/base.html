<!DOCTYPE html>
<html>

<head>
    <title>Beast Money Maker</title>
    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2216%22>🐺</text></svg>">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f1117;
        }

        .navbar {
            border-bottom: 1px solid #1f2937;
        }

        .card {
            border-radius: 14px;
            border: 1px solid #1f2937;
            background-color: #111827;
        }

        .nav-pills .nav-link {
            background: #1f2937;
            color: #9ca3af;
            border-radius: 10px;
            margin-right: 10px;
            transition: 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background: #2563eb;
            color: white;
        }

        .nav-pills .nav-link:hover {
            background: #374151;
            color: white;
        }

        .form-control,
        .form-select {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: white;
        }

        .form-control:focus {
            background-color: #1f2937;
            color: white;
            border-color: #2563eb;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .toast-container {
            z-index: 2000;
        }

        .text-success {
            color: chartreuse !important;
        }

        /* Animación de fila al cerrarse */
        #performance tbody tr {
            transition: opacity 0.3s ease, background-color 0.2s ease;
        }

        #performance tbody tr:hover {
            background-color: #1f2937 !important;
        }

        /* Botón de close: hover effect */
        .btn-close-position {
            transition: transform 0.1s ease;
        }

        .btn-close-position:hover {
            transform: scale(1.05);
        }

        .btn-close-position:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tab-pane {
            transition: opacity 0.15s ease-in-out;
        }

        /* Highlight visual en el botón del tab activo */
        .nav-pills .nav-link.active {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5);
        }

        /* Highlight para el día actual en el calendario */
        #calendar tbody tr.table-info {
            background-color: rgba(191, 226, 239, 0.15) !important;
        }

        /* Animación suave al cargar filas */
        #calendar tbody tr {
            transition: background-color 0.2s ease;
        }

        /* Tooltip para ver detalles al pasar el mouse */
        #calendar tbody tr:hover {
            background-color: #1f2937 !important;
            cursor: default;
        }
    </style>
</head>

    <!--  SCRIPTS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict'

            const form = document.getElementById('configForm')
            const openConfirm = document.getElementById('openConfirm')
            const openConfirmBreakout = document.getElementById('openConfirmBreakout')
            const openConfirmStophunt = document.getElementById('openConfirmStophunt')
            const openConfirmRsiBB = document.getElementById('openConfirmRsiBB')
            const openConfirmMacd = document.getElementById('openConfirmMacd')
            const openConfirmStructure = document.getElementById('openConfirmStructure')
            const confirmSave = document.getElementById('confirmSave')
            const modal = new bootstrap.Modal(document.getElementById('confirmModal'))
            const toastEl = document.getElementById('mainToast')
            const toastMsg = document.getElementById('toastMessage')
            const toast = new bootstrap.Toast(toastEl)

            openConfirm.addEventListener('click', () => {
                if (!form.checkValidity()) {
                    form.classList.add('was-validated')
                    return
                }
                modal.show()
            })

            openConfirmBreakout.addEventListener('click', () => {
                if (!form.checkValidity()) {
                    form.classList.add('was-validated')
                    return
                }
                modal.show()
            })

            openConfirmStophunt.addEventListener('click', () => {
                if (!form.checkValidity()) {
                    form.classList.add('was-validated')
                    return
                }
                modal.show()
            })

            if (openConfirmRsiBB) {
                openConfirmRsiBB.addEventListener('click', () => {
                    if (!form.checkValidity()) {
                        form.classList.add('was-validated')
                        return
                    }
                    modal.show()
                })
            }

            if (openConfirmMacd) {
                openConfirmMacd.addEventListener('click', () => {
                    if (!form.checkValidity()) {
                        form.classList.add('was-validated')
                        return
                    }
                    modal.show()
                })
            }

            if (openConfirmStructure) {
                openConfirmStructure.addEventListener('click', () => {
                    if (!form.checkValidity()) {
                        form.classList.add('was-validated')
                        return
                    }
                    modal.show()
                })
            }

            confirmSave.addEventListener('click', async () => {

                console.log("CLICK CONFIRM SAVE");

                try {

                    const formData = new FormData(form)
                    const data = {}

                    // Inicializar TODOS los checkboxes (unchecked no aparecen en FormData)
                    const checkboxIds = [
                        'paused', 'paper_trading', 'trailing_automatico', 'adx_rising',
                        'trailing_use_atr', 'use_take_profit', 'tp_by_pct',
                        'stop_hunt_use_ema_filter', 'rsi_bb_require_divergence'
                    ];
                    checkboxIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) data[id] = el.checked;
                    });

                    formData.forEach((value, key) => {
                        if (key.startsWith('strategy_symbols_')) {
                            // Agrupar en dict strategy_symbols
                            if (!data.strategy_symbols) data.strategy_symbols = {}
                            const strat = key.replace('strategy_symbols_', '')
                            data.strategy_symbols[strat] = value
                        } else if (key === "symbols") {
                            data[key] = value.split(",").map(s => s.trim())
                        } else if (checkboxIds.includes(key)) {
                            // Ya se manejó arriba, no sobreescribir
                        } else if (key === "timeframe") {
                            data[key] = value
                        } else if (key === "strategy_mode") {
                            data[key] = value
                        } else if (key === "tp_sl_mode") {
                            data[key] = value
                        } else if (key === "pivot_len" || key === "ema_fast" || key === "ema_slow" ||
                                    key === "cooldown_bars" || key === "max_positions" ||
                                    key === "leverage" || key === "order_block_lookback" ||
                                    key === "stop_hunt_min_zones" || key === "stop_hunt_min_break_candles" ||
                                    key === "stop_hunt_momentum_bars" ||
                                    key === "rsi_bb_rsi_period" || key === "rsi_bb_bb_period" ||
                                    key === "rsi_bb_stoch_period" || key === "rsi_bb_divergence_lookback") {
                            data[key] = parseInt(value, 10)
                        } else {
                            data[key] = Number(value)
                        }
                    })

                    console.log("Payload enviado:", data);

                    const res = await fetch("/update-config", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data)
                    })

                    console.log("Status:", res.status);

                    const responseText = await res.text()
                    console.log("Response body:", responseText);

                    modal.hide()

                    if (res.ok) {
                        toastEl.classList.remove("text-bg-danger")
                        toastEl.classList.add("text-bg-success")
                        toastMsg.innerText = "Configuración actualizada correctamente"
                        toast.show()
                        setTimeout(() => location.reload(), 1500)
                    } else {
                        toastEl.classList.remove("text-bg-success")
                        toastEl.classList.add("text-bg-danger")
                        toastMsg.innerText = "Error: " + responseText
                        toast.show()
                    }

                } catch (error) {
                    console.error("ERROR EN FETCH:", error)
                    alert("Error JS: " + error.message)
                }

            })

        })()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const equityData = {{ equity_curve | tojson }};
        const drawdownData = {{ drawdown_curve | tojson }};
        const maxDrawdown = {{ max_drawdown }};

        const labels = equityData.map(e => e.created_at);
        const equityValues = equityData.map(e => e.total_balance);
        // Mostrar equity actual arriba // 
        const currentEquity = equityValues.length ? equityValues[equityValues.length - 1] : 0;

        // ---------- EQUITY CHART ---------- //
        const equityCtx = document.getElementById("equityChart").getContext("2d");
        const equityGradient = equityCtx.createLinearGradient(0, 0, 0, 300);
        equityGradient.addColorStop(0, "rgba(0,255,0,0.35)");
        equityGradient.addColorStop(1, "rgba(0,255,0,0)");
        window.equityChart = new Chart(equityCtx, { type: "line", data: { labels: labels, datasets: [{ data: equityValues, borderColor: "lime", backgroundColor: equityGradient, fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 }] }, options: { animation: { duration: 1200, easing: 'easeOutQuart' }, plugins: { legend: { display: false }, tooltip: { backgroundColor: "#111", borderColor: "lime", borderWidth: 1, callbacks: { label: ctx => "$" + ctx.parsed.y.toFixed(2) } } }, scales: { x: { ticks: { color: "#888" }, grid: { display: false } }, y: { ticks: { color: "#888", callback: value => "$" + value }, grid: { color: "rgba(255,255,255,0.04)" } } } } });

        // ---------- DRAWDOWN CHART ---------- //
        const drawdownCtx = document.getElementById("drawdownChart").getContext("2d");
        const drawdownGradient = drawdownCtx.createLinearGradient(0, 0, 0, 300);
        drawdownGradient.addColorStop(0, "rgba(255,0,0,0.4)");
        drawdownGradient.addColorStop(1, "rgba(255,0,0,0)");
        new Chart(drawdownCtx, { type: "line", data: { labels: labels, datasets: [{ data: drawdownData, borderColor: "red", backgroundColor: drawdownGradient, fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 }, { label: "Max DD", data: Array(labels.length).fill(maxDrawdown), borderColor: "rgba(255,0,0,0.6)", borderDash: [6, 6], pointRadius: 0, fill: false }] }, options: { animation: { duration: 1200, easing: 'easeOutQuart' }, plugins: { legend: { display: false }, tooltip: { backgroundColor: "#111", borderColor: "red", borderWidth: 1, callbacks: { label: ctx => ctx.parsed.y.toFixed(2) + "%" } } }, scales: { x: { ticks: { color: "#888" }, grid: { display: false } }, y: { reverse: true, ticks: { color: "#888", callback: value => value + "%" }, grid: { color: "rgba(255,0,0,0.05)" } } } } }); 
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startDate = document.getElementById('exportStartDate');
            const endDate = document.getElementById('exportEndDate');

            // No permitir fecha fin antes de fecha inicio
            startDate?.addEventListener('change', () => {
                if (endDate && startDate.value) {
                    endDate.min = startDate.value;
                }
            });

            endDate?.addEventListener('change', () => {
                if (startDate && endDate.value) {
                    startDate.max = endDate.value;
                }
            });

            // Por defecto: último mes
            const today = new Date().toISOString().split('T')[0];
            const lastMonth = new Date();
            lastMonth.setMonth(lastMonth.getMonth() - 1);
            const lastMonthStr = lastMonth.toISOString().split('T')[0];

            if (startDate) startDate.value = lastMonthStr;
            if (endDate) endDate.value = today;
        });
    </script>

    <script>
        async function updateStats() {
            try {
                const res = await fetch("/api/stats");
                if (!res.ok) return;

                const data = await res.json();

                // Daily PnL: Priorizar Binance si existe, sino fallback a DB
                const dailyPnlEl = document.getElementById("daily-pnl");
                if (dailyPnlEl) {
                    // ✅ Usar Binance value si existe, sino DB
                    const pnl = data.stats.daily_pnl_binance !== undefined
                        ? data.stats.daily_pnl_binance
                        : data.stats.daily_pnl;

                    dailyPnlEl.innerText = parseFloat(pnl).toFixed(2) + " USDT";
                    dailyPnlEl.className = pnl >= 0 ? "text-success" : "text-danger";
                }
                const badgeEl = document.getElementById("pnl-source-badge");
                if (badgeEl) {
                    if (data.stats.daily_pnl_binance !== undefined) {
                        badgeEl.innerText = "Binance Real";
                        badgeEl.className = "badge bg-success text-dark";
                    } else {
                        badgeEl.innerText = "DB Local";
                        badgeEl.className = "badge bg-warning text-dark";
                    }
                }

                // Equity
                const equityEl = document.getElementById("equity");
                if (equityEl && data.account) {
                    equityEl.innerText = parseFloat(data.account.equity).toFixed(2);
                }

                // Bot status
                const botEl = document.getElementById("bot-status");
                if (botEl) {
                    botEl.innerText = data.bot_status;
                }

            } catch (e) {
                console.error("Stats update failed", e);
            }
        }

        async function updateUnrealizedPnL() {
            try {
                const res = await fetch("/api/open-positions/pnl");
                if (!res.ok) return;

                const data = await res.json();

                // ✅ CORRECCIÓN: Desestructurar el objeto values correctamente
                Object.entries(data).forEach(([symbol, values]) => {
                    const { unrealized_pnl, mark_price, pnl_pct } = values;

                    // ✅ Actualizar Unrealized PnL
                    const pnlEl = document.getElementById(`pnl-${symbol}`);
                    if (pnlEl && unrealized_pnl !== undefined) {
                        const value = parseFloat(unrealized_pnl);
                        pnlEl.innerText = value.toFixed(2) + " USDT";
                        pnlEl.className = value >= 0 ? "text-success" : "text-danger";
                    }

                    // ✅ Actualizar Mark Price
                    const markEl = document.getElementById(`mark-${symbol}`);
                    if (markEl && mark_price !== undefined) {
                        const mark = parseFloat(mark_price);
                        markEl.innerText = mark.toFixed(4);
                    }

                    // ✅ Actualizar PnL %
                    const pctEl = document.getElementById(`pnlpct-${symbol}`);
                    if (pctEl && pnl_pct !== undefined) {
                        const pct = parseFloat(pnl_pct);
                        pctEl.innerText = pct.toFixed(2) + "%";
                        pctEl.className = pct >= 0 ? "text-success" : "text-danger";
                    }
                });

            } catch (e) {
                console.error("Unrealized update failed", e);
            }
        }

        setInterval(() => {
            updateStats();
            updateUnrealizedPnL();
            updateTrailingStatus();
            updateSymbolsStatus();
        }, 5000);
    </script>

    <script>
        async function updateHealth() {
            try {
                const res = await fetch("/api/health");
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById("exchange-health");
                if (!badge) return;

                if (data.api_reachable) {
                    badge.className = "badge bg-success ms-3";
                    badge.innerText = "API OK - " + data.latency_ms + "ms";
                } else {
                    badge.className = "badge bg-danger ms-3";
                    badge.innerText = "API DOWN";
                }

            } catch {
                const badge = document.getElementById("exchange-health");
                if (badge) {
                    badge.className = "badge bg-danger ms-3";
                    badge.innerText = "API ERROR";
                }
            }
        }

        setInterval(updateHealth, 20000);
        updateHealth();
    </script>

    <script>
        async function updateTimeframe() {
            try {
                const res = await fetch("/api/timeframe");
                if (!res.ok) return;
                const data = await res.json();

                // Actualizar display del navbar
                const tfDisplay = document.getElementById("timeframe-display");
                if (tfDisplay) {
                    tfDisplay.innerText = data.timeframe_display;
                }

                // Actualizar badge en Configuración
                const tfBadge = document.getElementById("current-timeframe-badge");
                if (tfBadge) {
                    tfBadge.innerText = `Actual: ${data.timeframe_display}`;
                }

                // Opcional: Pre-seleccionar el timeframe actual en el select
                const tfSelect = document.querySelector('select[name="timeframe"]');
                if (tfSelect) {
                    tfSelect.value = data.timeframe;
                }
            } catch (e) {
                console.error("Timeframe update failed", e);
            }
        }

        updateTimeframe();
        setInterval(updateTimeframe, 30000);

    <script>
        document.getElementById('confirmExport')?.addEventListener('click', async () => {
            const startDate = document.getElementById('exportStartDate')?.value;
            const endDate = document.getElementById('exportEndDate')?.value;
            const symbol = document.getElementById('exportSymbol')?.value;

            // Construir query params
            const params = new URLSearchParams();
            params.append('format', 'csv');
            if (startDate) params.append('start_date', startDate);
            if (endDate) params.append('end_date', endDate);
            if (symbol) params.append('symbol', symbol);

            // Feedback visual
            const btn = document.getElementById('confirmExport');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generando...';
            btn.disabled = true;

            try {
                // Abrir en nueva pestaña para descargar
                window.open(`/api/export/trades?${params.toString()}`, '_blank');

                // Cerrar modal y resetear botón
                const modal = bootstrap.Modal.getInstance(document.getElementById('exportFiltersModal'));
                modal?.hide();

                // Toast de éxito
                showToast('✅ Exportación iniciada. Revisá tu carpeta de descargas.', 'success');

            } catch (e) {
                console.error('Export error:', e);
                showToast('❌ Error al exportar: ' + e.message, 'danger');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Helper para toasts (si no tenés uno ya)
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('mainToast');
            const toastMsg = document.getElementById('toastMessage');
            if (!toastEl || !toastMsg) return;

            toastEl.classList.remove('text-bg-success', 'text-bg-danger', 'text-bg-info', 'text-bg-warning');
            toastEl.classList.add(`text-bg-${type}`);
            toastMsg.innerText = message;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        // ============================================================
        // TRAILING STATUS
        // ============================================================
        async function updateTrailingStatus() {
            try {
                const res = await fetch("/api/trailing-status");
                if (!res.ok) return;
                const data = await res.json();
                
                if (!data.trailing) return;
                
                Object.entries(data.trailing).forEach(([symbol, info]) => {
                    const el = document.getElementById(`trailing-${symbol}`);
                    if (!el) return;
                    
                    if (info.activated) {
                        const best = info.best ? parseFloat(info.best).toFixed(2) : 'N/A';
                        const sl = info.sl ? parseFloat(info.sl).toFixed(2) : 'N/A';
                        el.innerHTML = `<span class="badge bg-success" title="Best: ${best}">🔒 ON</span>`;
                    } else {
                        el.innerHTML = `<span class="badge bg-secondary">OFF</span>`;
                    }
                });
            } catch (e) {
                console.error("Trailing status update failed", e);
            }
        }

        // ============================================================
        // SYMBOLS STATUS
        // ============================================================
        async function updateSymbolsStatus() {
            try {
                const res = await fetch("/api/symbols-status");
                if (!res.ok) return;
                const data = await res.json();
                
                // Ocultar loading, mostrar contenido
                const loading = document.getElementById('symbols-status-loading');
                const content = document.getElementById('symbols-status-content');
                if (loading) loading.style.display = 'none';
                if (content) content.style.display = 'block';
                
                const tableBody = document.getElementById('symbols-status-table');
                if (!tableBody) return;
                
                tableBody.innerHTML = data.symbols.map(sym => {
                    // Estado
                    let estado = '<span class="badge bg-secondary">Libre</span>';
                    if (sym.has_position) {
                        estado = '<span class="badge bg-success">Abierta</span>';
                    } else if (sym.in_cooldown) {
                        estado = '<span class="badge bg-warning">Cooldown</span>';
                    }
                    
                    // Posición
                    let posicion = '-';
                    if (sym.has_position) {
                        posicion = `<span class="badge bg-info">${sym.trail_sl ? 'SL: ' + parseFloat(sym.trail_sl).toFixed(2) : 'Sin SL'}</span>`;
                    }
                    
                    // Trailing
                    let trailing = '-';
                    if (sym.has_trailing) {
                        trailing = `<span class="badge bg-success">ON</span>`;
                    }
                    
                    // Cooldown
                    let cooldown = '-';
                    if (sym.in_cooldown && sym.remaining_cooldown > 0) {
                        cooldown = `<span class="badge bg-warning">${Math.ceil(sym.remaining_cooldown)}s</span>`;
                    }
                    
                    return `
                        <tr>
                            <td><strong>${sym.symbol}</strong></td>
                            <td>${estado}</td>
                            <td>${posicion}</td>
                            <td>${trailing}</td>
                            <td>${cooldown}</td>
                        </tr>
                    `;
                }).join('');
                
            } catch (e) {
                console.error("Symbols status update failed", e);
            }
        }

        // Inicializar status de símbolos al cargar
        document.addEventListener('DOMContentLoaded', () => {
            updateTrailingStatus();
            updateSymbolsStatus();
        });

        // Opcional: Limpiar filtros al cerrar modal
        document.getElementById('exportFiltersModal')?.addEventListener('hidden.bs.modal', () => {
            document.getElementById('exportFiltersForm')?.reset();
        });
    </script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            initAnalyticsFilters();
        });

        function initAnalyticsFilters() {
            const startDate = document.getElementById('analyticsStartDate');
            const endDate = document.getElementById('analyticsEndDate');

            // Por defecto: último mes
            const today = new Date();
            const lastMonth = new Date();
            lastMonth.setMonth(lastMonth.getMonth() - 1);

            if (startDate) {
                startDate.value = lastMonth.toISOString().split('T')[0];
                startDate.max = today.toISOString().split('T')[0];
            }
            if (endDate) {
                endDate.value = today.toISOString().split('T')[0];
                endDate.min = lastMonth.toISOString().split('T')[0];
            }

            // Validación cruzada de fechas
            startDate?.addEventListener('change', () => {
                if (endDate && startDate.value) {
                    endDate.min = startDate.value;
                    if (endDate.value < startDate.value) {
                        endDate.value = startDate.value;
                    }
                }
            });

            endDate?.addEventListener('change', () => {
                if (startDate && endDate.value) {
                    startDate.max = endDate.value;
                    if (startDate.value > endDate.value) {
                        startDate.value = endDate.value;
                    }
                }
            });

            // Cargar símbolos únicos para el dropdown
            loadAnalyticsSymbols();
        }

        async function loadAnalyticsSymbols() {
            try {
                // Usamos el endpoint sin filtros para obtener todos los símbolos
                const res = await fetch('/api/analytics');
                if (!res.ok) return;
                const data = await res.json();

                const symbolSelect = document.getElementById('analyticsSymbol');
                if (!symbolSelect) return;

                // Guardar opción "Todos"
                const allOption = symbolSelect.querySelector('option[value=""]');
                symbolSelect.innerHTML = '';

            const lastMonth = new Date();
            lastMonth.setMonth(lastMonth.getMonth() - 1);

            if (startDate) {
                startDate.value = lastMonth.toISOString().split('T')[0];
                startDate.max = today.toISOString().split('T')[0];

            if (endDate) {
                endDate.value = today.toISOString().split('T')[0];
                endDate.min = lastMonth.toISOString().split('T')[0];
            }

            // Validación cruzada de fechas
            startDate?.addEventListener('change', () => {
                if (endDate && startDate.value) {
                    endDate.min = startDate.value;
                    if (endDate.value < startDate.value) {
                        endDate.value = startDate.value;
                    }
                }
            });

            endDate?.addEventListener('change', () => {
                if (startDate && endDate.value) {
                    startDate.max = endDate.value;

    // ---------- SPARKLINES (lazy, on tab show) ----------
    const sparklineCache = {};
    function loadSparklines() {
        const canvases = document.querySelectorAll("canvas[data-symbol]");
        if (!canvases.length) return;
        Array.from(canvases).forEach(canvas => {
            const sym = canvas.dataset.symbol;
            if (sparklineCache[sym]) { drawSparkline(canvas, sparklineCache[sym]); return; }
            fetch("/api/sparkline/" + sym)
                .then(r => r.json())
                .then(d => { sparklineCache[sym] = d.closes || []; drawSparkline(canvas, sparklineCache[sym]); })
                .catch(() => {});
        });
    }
    function drawSparkline(canvas, closes) {
        if (!closes.length) return;
        const ctx = canvas.getContext("2d");
        const w = canvas.width, h = canvas.height;
        const min = Math.min(...closes), max = Math.max(...closes);
        const range = max - min || 1;
        const color = closes[closes.length - 1] >= closes[0] ? "#00ff88" : "#ff4444";
        ctx.clearRect(0, 0, w, h);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        closes.forEach((v, i) => {
            const x = (i / (closes.length - 1)) * w;
            const y = h - ((v - min) / range) * (h - 4) - 2;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    // ---------- SORT HELPERS ----------
    function updateSortIcons(tableId, col, asc) {
        document.querySelectorAll("#" + tableId + " .sort-icon").forEach(el => {
            const c = parseInt(el.dataset.col);
            el.textContent = c === col ? (asc ? "↑" : "↓") : "⇅";
        });
    }
    function sortNumeric(a, b, asc) {
        return a < b ? (asc ? -1 : 1) : a > b ? (asc ? 1 : -1) : 0;
    }

    // ---------- SORT: PERFORMANCE ----------
    let perfSortCol = -1, perfSortAsc = true;
    function sortPerformance(col) {
        if (perfSortCol === col) perfSortAsc = !perfSortAsc; else { perfSortCol = col; perfSortAsc = true; }
        updateSortIcons("closedPositionsTable", col, perfSortAsc);
        renderSortedPerformance();
    }
    function renderSortedPerformance() {
        const tbody = document.getElementById("closedPositionsTableBody");
        if (!tbody) return;
        let rows;
        if ((window._perfData || []).length > 0) {
            rows = (window._perfData || []).slice();
        } else {
            // Fallback: leer directo del DOM si el array no se populó
            rows = Array.from(tbody.querySelectorAll("tr")).map(row => {
                const c = row.cells;
                return {
                    symbol: c[0]?.textContent.trim() || "",
                    side: c[1]?.textContent.trim() || "",
                    entry_price: parseFloat(c[2]?.textContent.trim()) || 0,
                    exit_price: parseFloat(c[3]?.textContent.trim()) || 0,
                    realized_pnl: parseFloat(c[4]?.textContent.trim()) || 0,
                    commission: parseFloat((c[5]?.textContent.trim() || "0").replace(/[^0-9.]/g, "")) || 0
                };
            });
        }
        const col = perfSortCol, asc = perfSortAsc;
        rows.sort((a, b) => {
            const va = Object.values(a)[col], vb = Object.values(b)[col];
            const na = typeof va === "number" ? va : String(va).toLowerCase();
            const nb = typeof vb === "number" ? vb : String(vb).toLowerCase();
            return sortNumeric(na, nb, asc);
        });
        tbody.innerHTML = rows.map(t => `<tr>
            <td style="color:#fff">${t.symbol}</td>
            <td style="color:#fff">${t.side}</td>
            <td style="color:#fff">${t.entry_price}</td>
            <td style="color:#fff">${t.exit_price}</td>
            <td style="color:${t.realized_pnl > 0 ? "#00ff88" : "#ff4444"}">${t.realized_pnl}</td>
            <td style="color:#ffcc00">-$${(t.commission || 0).toFixed(4)}</td>
        </tr>`).join("");
    }

    // ---------- SORT: ANALYTICS ----------
    let analytSortCol = -1, analytSortAsc = true;
    function sortAnalytics(col) {
        if (analytSortCol === col) analytSortAsc = !analytSortAsc; else { analytSortCol = col; analytSortAsc = true; }
        updateSortIcons("analyticsTable", col, analytSortAsc);
        renderSortedAnalytics();
    }
    function renderSortedAnalytics() {
        const tbody = document.getElementById("analyticsTableBody");
        if (!tbody) return;
        let rows;
        if ((window._analytData || []).length > 0) {
            rows = (window._analytData || []).slice();
        } else {
            rows = Array.from(tbody.querySelectorAll("tr")).map(row => {
                const c = row.cells;
                return {
                    symbol: c[0]?.textContent.trim() || "",
                    total_trades: parseInt(c[1]?.textContent.trim()) || 0,
                    total_pnl: parseFloat(c[2]?.textContent.trim()) || 0,
                    best_trade: parseFloat(c[3]?.textContent.trim()) || 0,
                    worst_trade: parseFloat(c[4]?.textContent.trim()) || 0,
                    avg_hold_hours: parseFloat(c[5]?.textContent.trim()) || 0
                };
            });
        }
        const col = analytSortCol, asc = analytSortAsc;
        rows.sort((a, b) => {
            const va = Object.values(a)[col], vb = Object.values(b)[col];
            const na = typeof va === "number" ? va : String(va).toLowerCase();
            const nb = typeof vb === "number" ? vb : String(vb).toLowerCase();
            return sortNumeric(na, nb, asc);
        });
        tbody.innerHTML = rows.map(r => `<tr>
            <td style="color:#fff">${r.symbol}</td>
            <td style="color:#fff">${r.total_trades}</td>
            <td style="color:${r.total_pnl >= 0 ? "#00ff88" : "#ff4444"}">${r.total_pnl.toFixed(2)}</td>
            <td style="color:${r.best_trade >= 0 ? "#00ff88" : "#ff4444"}">${r.best_trade.toFixed(2)}</td>
            <td style="color:${r.worst_trade >= 0 ? "#00ff88" : "#ff4444"}">${r.worst_trade.toFixed(2)}</td>
            <td style="color:#fff">${r.avg_hold_hours.toFixed(2)}</td>
        </tr>`).join("");
    }

    // ---------- SORT: TRAILING ----------
    let trailSortCol = -1, trailSortAsc = false;
    function sortTrailing(col) {
        if (trailSortCol === col) trailSortAsc = !trailSortAsc; else { trailSortCol = col; trailSortAsc = false; }
        const rows = Array.from(document.querySelectorAll("#trailingTableBody tr"));
        rows.sort((a, b) => {
            const va = a.cells[col]?.textContent.trim() || "";
            const vb = b.cells[col]?.textContent.trim() || "";
            const na = isNaN(va) ? va.toLowerCase() : parseFloat(va);
            const nb = isNaN(vb) ? vb.toLowerCase() : parseFloat(vb);
            return sortNumeric(na, nb, trailSortAsc);
        });
        const tbody = document.getElementById("trailingTableBody");
        rows.forEach(r => tbody.appendChild(r));
    }

    // ---------- INIT (post-DOM + post-polling) ----------
    let _initDone = false;
    async function initNewFeatures() {
        if (_initDone) return;
        _initDone = true;

        // Performance table: fetch directly from API (tabla se llena con polling async)
        try {
            const res = await fetch("/api/closed-positions");
            const data = await res.json();
            const trades = data.trades || data || [];
            window._perfData = trades.map(t => ({
                symbol: t.symbol || "",
                side: t.side || "",
                entry_price: parseFloat(t.entry_price) || 0,
                exit_price: parseFloat(t.exit_price) || 0,
                realized_pnl: parseFloat(t.realized_pnl) || 0,
                commission: parseFloat(t.commission) || 0
            }));
            renderSortedPerformance();
        } catch (e) {
            // Fallback: leer del HTML ya renderizado
            const perfRows = document.querySelectorAll("#closedPositionsTableBody tr");
            window._perfData = Array.from(perfRows).map(row => {
                const cells = row.cells;
                return {
                    symbol: cells[0]?.textContent.trim() || "",
                    side: cells[1]?.textContent.trim() || "",
                    entry_price: parseFloat(cells[2]?.textContent.trim()) || 0,
                    exit_price: parseFloat(cells[3]?.textContent.trim()) || 0,
                    realized_pnl: parseFloat(cells[4]?.textContent.trim()) || 0,
                    commission: parseFloat((cells[5]?.textContent.trim() || "0").replace(/[^0-9.]/g, "")) || 0
                };
            });
            renderSortedPerformance();
        }

        // Analytics table: leer del HTML (Jinja lo renderiza con datos iniciales)
        const analytRows = document.querySelectorAll("#analyticsTableBody tr");
        window._analytData = Array.from(analytRows).map(row => {
            const cells = row.cells;
            return {
                symbol: cells[0]?.textContent.trim() || "",
                total_trades: parseInt(cells[1]?.textContent.trim()) || 0,
                total_pnl: parseFloat(cells[2]?.textContent.trim()) || 0,
                best_trade: parseFloat(cells[3]?.textContent.trim()) || 0,
                worst_trade: parseFloat(cells[4]?.textContent.trim()) || 0,
                avg_hold_hours: parseFloat(cells[5]?.textContent.trim()) || 0
            };
        });
        if (window._analytData.length) renderSortedAnalytics();

        // Sparklines cuando el tab de performance este visible
        loadSparklines();
    }

    // Run when DOM is ready
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initNewFeatures);
    } else {
        setTimeout(initNewFeatures, 200);
    }

    // Load sparklines when performance tab becomes visible
    document.addEventListener("shown.bs.tab", e => {
        if (e.target.dataset?.bsTarget === "#performance" ||
            e.target.dataset?.bsTarget === "#overview") {
            setTimeout(loadSparklines, 100);
        }
    });

    // ── Strategy Stats ──────────────────────────────────────
    async function loadStrategyStats() {
        try {
            const res = await fetch("/api/strategy-stats");
            const data = await res.json();
            const tbody = document.getElementById("strategyStatsBody");
            if (!tbody || !data.strategies) return;

            if (data.strategies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">Sin trades cerrados aún</td></tr>';
                return;
            }

            let html = "";
            let totalPnl = 0;
            let totalTrades = 0;

            data.strategies.forEach(s => {
                const pnlColor = s.net_pnl >= 0 ? "text-success" : "text-danger";
                const wrColor = s.win_rate >= 50 ? "text-success" : "text-warning";
                const pfColor = s.profit_factor >= 1.5 ? "text-success" : s.profit_factor >= 1.0 ? "text-warning" : "text-danger";

                html += `<tr>
                    <td><strong>${s.strategy}</strong></td>
                    <td>${s.total_trades} <small class="text-muted">(${s.wins}W/${s.losses}L)</small></td>
                    <td class="${wrColor}">${s.win_rate}%</td>
                    <td class="${pnlColor}">${s.total_pnl >= 0 ? '+' : ''}$${s.total_pnl.toFixed(4)}</td>
                    <td class="${pfColor}">${s.profit_factor}</td>
                    <td>-$${s.total_commission.toFixed(4)}</td>
                    <td class="${pnlColor}"><strong>${s.net_pnl >= 0 ? '+' : ''}$${s.net_pnl.toFixed(4)}</strong></td>
                    <td class="text-success">+$${s.best_trade.toFixed(4)}</td>
                    <td class="text-danger">$${s.worst_trade.toFixed(4)}</td>
                </tr>`;

                totalPnl += s.net_pnl;
                totalTrades += s.total_trades;
            });

            // Total row
            const totalColor = totalPnl >= 0 ? "text-success" : "text-danger";
            html += `<tr style="border-top: 2px solid #555;">
                <td><strong>TOTAL</strong></td>
                <td><strong>${totalTrades}</strong></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="${totalColor}"><strong>${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(4)}</strong></td>
                <td></td>
                <td></td>
            </tr>`;

            tbody.innerHTML = html;
        } catch (e) {
            console.error("Strategy stats load failed", e);
        }
    }

    loadStrategyStats();
    setInterval(loadStrategyStats, 10000);

    loadTrailingStatus();
    loadBenchmark();
    setInterval(loadTrailingStatus, 3000);
    </script>

</body>
</html>
